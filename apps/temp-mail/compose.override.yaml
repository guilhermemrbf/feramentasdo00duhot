services:
  web:
    ports: ["127.0.0.1:8080:80"]
  postfix:
    ports: ["127.0.0.1:1025:25"]
  mailpit:
    image: axllent/mailpit:v1.28
    environment:
      MP_MAX_MESSAGES: "20"
      MP_SMTP_RELAY_HOST: postfix
      MP_SMTP_RELAY_PORT: "25"
      MP_SMTP_RELAY_MATCHING: '(^|<)caixa-[a-f0-9]{24}@mail\.test$'
    networks: [mx]
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1026:1025"]
    restart: unless-stopped
