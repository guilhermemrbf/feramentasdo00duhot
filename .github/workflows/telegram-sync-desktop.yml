name: Telegram Sync Windows
on:
  push:
    branches: [main]
    paths:
      - 'apps/telegram-sync-desktop/**'
      - '.github/workflows/telegram-sync-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    # Never consume a private repository's billable Actions allowance.
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: apps/telegram-sync-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test local storage, engine and Windows credential protection
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TelegramSync --collect-all telethon main.py
      - name: Smoke test the executable
        run: |
          $process = Start-Process -FilePath 'dist/TelegramSync.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executable self-test failed: $($process.ExitCode)" }
      - name: Package portable application
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Compress-Archive -Path dist/TelegramSync.exe,dist/LEIA-ME.txt -DestinationPath dist/TelegramSync-Windows.zip
          $hash = (Get-FileHash dist/TelegramSync-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  TelegramSync-Windows.zip" | Out-File dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish download after successful tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'telegram-sync-desktop-' + '${{ github.run_number }}' + '-' + '${{ github.run_attempt }}'
          gh release create $tag dist/TelegramSync-Windows.zip dist/SHA256SUMS.txt --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'Telegram Sync Desktop 0.1.0 — Windows' --notes-file LEIA-ME.txt --prerelease
