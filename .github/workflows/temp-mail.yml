name: Correio Temporário
on:
  push:
    paths:
      - "apps/temp-mail/**"
      - ".github/workflows/temp-mail.yml"
  pull_request:
    paths:
      - "apps/temp-mail/**"
      - ".github/workflows/temp-mail.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smtp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/temp-mail
    env:
      ADMIN_EMAIL: operator@example.test
      ADMIN_PASSWORD: only-for-disposable-ci-mailbox
      TEST_ADMIN_EMAIL: operator@example.test
      TEST_ADMIN_PASSWORD: only-for-disposable-ci-mailbox
      CREATE_PER_HOUR: "50"
      COMPOSE_FILE: compose.yaml:compose.override.yaml:compose.test.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build && pnpm exec tsc --noEmit && pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/init-env.mjs
      - id: stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Validar o fluxo no Chromium
        run: pnpm run test:e2e
      - name: Testar API, Postfix, fila e banco na rede interna
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: docker compose run --rm --no-deps verify
      - if: failure()
        run: docker compose logs --tail 60
      - if: always()
        run: docker compose down --volumes
      - name: Preparar certificados e nomes locais do perfil de produção
        id: prod-config
        run: |
          cert_dir="$RUNNER_TEMP/temp-mail-cert"
          mkdir -p "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
            -subj "/CN=correio.example.com" \
            -addext "subjectAltName=DNS:correio.example.com,DNS:mx.example.com" \
            -keyout "$cert_dir/privkey.pem" -out "$cert_dir/fullchain.pem"
          printf '%s\n' '127.0.0.1 correio.example.com mx.example.com' | sudo tee -a /etc/hosts > /dev/null
          {
            echo "APP_URL=https://correio.example.com"
            echo "WEB_HOST=correio.example.com"
            echo "SMTP_HOST=mx.example.com"
            echo "DEFAULT_MAIL_DOMAIN=temporario.example.com"
            echo "ABUSE_CONTACT=abuse@example.com"
            echo "TLS_WEB_DIR=$cert_dir"
            echo "TLS_SMTP_DIR=$cert_dir"
            echo "NODE_EXTRA_CA_CERTS=$cert_dir/fullchain.pem"
          } >> "$GITHUB_ENV"
      - name: Subir o perfil de produção no runner
        run: docker compose -p temp-mail-production-check -f compose.yaml -f compose.prod.yaml up --wait --wait-timeout 120
      - name: Validar HTTPS, SMTP na porta 25 com STARTTLS e entrega ao vivo
        run: pnpm smoke:production https://correio.example.com temporario.example.com --mx-host mx.example.com
      - name: Ler logs do perfil de produção após falha
        if: ${{ failure() && steps.prod-config.outcome == 'success' }}
        run: docker compose -p temp-mail-production-check -f compose.yaml -f compose.prod.yaml logs --tail 60
      - name: Remover o ambiente de produção descartável
        if: ${{ always() && steps.prod-config.outcome == 'success' }}
        run: docker compose -p temp-mail-production-check -f compose.yaml -f compose.prod.yaml down --volumes
